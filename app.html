<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>2-2😻</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icons/favicon-64.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="2-2😻"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#FFE58A">
<style>
@font-face{font-family:'NeoDunggeunmo';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.3/NeoDunggeunmo.woff') format('woff');}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:#FFF8E7;overflow:hidden;font-family:'NeoDunggeunmo',sans-serif;color:#5B4636;}
.bar{position:fixed;left:0;right:0;top:0;height:50px;display:flex;align-items:center;gap:6px;padding:6px 8px;padding-top:max(6px,env(safe-area-inset-top));background:#FFF3C4;border-bottom:3px solid #5B4636;z-index:10;}
.bar .logo{display:flex;align-items:center;gap:4px;font-size:1.05rem;margin-right:4px;white-space:nowrap;}
.bar .logo img{width:28px;height:28px;image-rendering:pixelated;border-radius:6px;}
.bar button{flex:1;max-width:190px;font-family:inherit;font-size:1rem;border:2px solid #5B4636;border-radius:999px;background:#fff;color:#5B4636;padding:6px 6px;cursor:pointer;white-space:nowrap;}
.bar button.on{background:#FFD84D;box-shadow:0 3px 0 #5B4636;transform:translateY(-1px);}
.bar .sp{flex:1;}
.bar .ts{display:none;}
.bar .ask-t{flex:0 1 auto;max-width:150px;padding:6px 12px;}
@media (max-width:760px){ .bar .side .tl{display:none;} .bar .sub,.bar .inst{padding:5px 8px;} }
@media (max-width:560px){ .bar button .tl{display:none;} .bar button .ts{display:inline;} }
@media (max-width:420px){ .bar{gap:3px;padding-left:4px;padding-right:4px;} .bar > button[data-t]{font-size:.76rem !important;padding:6px 0 !important;letter-spacing:-.3px;} .bar .side{margin-left:2px !important;padding-left:4px !important;gap:2px !important;border-left:none;} .bar .sub,.bar .inst{padding:4px 5px !important;font-size:.8rem !important;} .cchip{margin-left:2px !important;padding:4px 5px !important;} .bar .sp{display:none;} }
@media (max-width:410px){ .bar > button[data-t] .em{display:none;} .bar > button[data-t]{font-size:.82rem !important;} }
.frames{position:fixed;left:0;right:0;top:50px;bottom:0;}
.frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#FFF8E7;visibility:hidden;}
.frames iframe.on{visibility:visible;}
.cchip{position:relative;flex:0 0 auto !important;max-width:none !important;display:flex;align-items:center;gap:4px;font-size:1.05rem !important;border:2px solid #8CCBA2 !important;background:#E4F7EA !important;border-radius:14px !important;padding:4px 10px !important;margin-left:8px;}
.cchip.on{background:#C9F0D8 !important;border-color:#5B4636 !important;box-shadow:0 3px 0 #5B4636;}
.cchip .faces{display:inline-flex;} .cchip .faces img{width:22px;height:22px;image-rendering:pixelated;border:2px solid #fff;border-radius:50%;background:#FFF5D1;margin-left:-7px;} .cchip .faces img:first-child{margin-left:2px;}
.cdot{position:absolute;top:-7px;right:-7px;min-width:18px;height:18px;border-radius:999px;background:#E8473A;color:#fff;font-size:11px;line-height:14px;text-align:center;border:2px solid #fff;padding:0 3px;}
.cdot[hidden]{display:none;}
#chatPop{position:fixed;right:12px;top:58px;width:min(440px,calc(100vw - 24px));height:min(640px,calc(100vh - 72px));background:#FFFDF6;border:3px solid #5B4636;border-radius:20px;box-shadow:0 8px 0 rgba(91,70,54,.35);z-index:15;display:flex;flex-direction:column;overflow:hidden;transform:translateY(-10px) scale(.98);opacity:0;pointer-events:none;transition:all .18s;}
#chatPop.on{transform:none;opacity:1;pointer-events:auto;}
.cp-head{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:#E4F7EA;border-bottom:2px solid #8CCBA2;font-size:1rem;}
.cp-head b{font-weight:normal;} .cp-head button{font-family:inherit;border:2px solid #5B4636;border-radius:10px;background:#FFC9D3;width:30px;height:30px;cursor:pointer;}
.cp-body{flex:1;position:relative;} .cp-body iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#FFF8E7;}
.bar .side{display:flex;align-items:center;gap:6px;margin-left:10px;padding-left:12px;border-left:2px dashed #D9C79A;}
.bar .sub,.bar .inst{flex:0 0 auto;max-width:none;font-size:.88rem;padding:5px 12px;border-color:#B9A58A;color:#7A6552;}
.bar .sub{background:#FFFDF6;}
.bar .snd{position:relative;} .bar .snd.off{background:#F1EFE8;} .bar .snd.auto{background:#E6F1FB;} .snd-b{position:absolute;bottom:-6px;right:-8px;background:#C0D9F5;border:1.5px solid #5B4636;border-radius:999px;font-size:10px;padding:0 4px;line-height:1.4;color:#0C447C;}
.bar .rl{padding:5px 9px;} .bar .rl.spin{animation:rlSpin .6s linear;}
@keyframes rlSpin{to{transform:rotate(360deg);}} .bar .sub.on{background:#FFD84D;border-color:#5B4636;color:#5B4636;}
.bar .inst{background:#E8ECFF;}
.bar .inst[hidden]{display:none;}
#iosOv{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(80,60,45,.55);padding:16px;}
#iosOv.on{display:flex;}
.io-box{position:relative;background:#FFFDF6;border:3px solid #5B4636;border-radius:20px;box-shadow:0 6px 0 #5B4636;padding:20px 22px;max-width:420px;width:100%;}
.io-box h3{font-weight:normal;font-size:1.15rem;margin-bottom:10px;}
.io-ol{padding-left:1.4rem;line-height:1.9;font-size:1rem;word-break:keep-all;}
.io-x{position:absolute;right:10px;top:10px;font-family:inherit;border:2px solid #5B4636;border-radius:10px;background:#FFC9D3;width:34px;height:34px;cursor:pointer;}
.ios-share{width:1.4em;height:1.4em;vertical-align:-0.35em;background:#fff;border:1px solid #D8D2C8;border-radius:.35em;padding:.1em;}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#fff;border:2px solid #5B4636;border-radius:999px;padding:6px 16px;z-index:30;display:none;}
@media (max-width:560px){ .bar .logo{display:none;} }
@media (max-width:480px){ .cchip .faces{display:none;} .cchip{margin-left:4px;padding:4px 7px !important;} #chatPop{right:6px;left:6px;width:auto;top:56px;height:calc(100vh - 64px);} .bar > button[data-t]{font-size:.8rem !important;padding:6px 1px !important;} .bar .inst,.bar .sub{font-size:.8rem;padding:5px 7px;} .bar .side{margin-left:4px;padding-left:6px;gap:4px;} .bar .logo span{display:none;} .bar button{font-size:.92rem;padding:6px 2px;} }
</style></head><body>
<div class="bar"><div class="logo"><img src="icons/favicon-64.png" alt=""><span>2-2😻</span></div>
  <button type="button" data-t="board"><span class="em">📋 </span>출석부</button><button type="button" data-t="notice"><span class="em">📢 </span><span class="tl">공지사항</span><span class="ts">공지</span></button><button type="button" data-t="me"><span class="em">🧸 </span>아지트</button><span class="sp"></span><button type="button" data-t="ask" class="ask-t"><span class="em">💌 </span><span class="tl">to. 시내T</span><span class="ts">시내T</span></button><button type="button" id="chatChip" class="cchip" title="우리 반 대화">💬<span class="faces" id="chatFaces"></span><span class="cdot" id="chatDot" hidden></span></button><span class="side"><button type="button" id="sndBtn" class="sub snd" title="소리 (수업 중에는 저절로 꺼져요)">🔊<span class="snd-b" hidden>수업</span></button><button type="button" id="reloadBtn" class="sub rl" title="지금 보는 화면 새로고침">🔄</button><button type="button" data-t="guide" class="sub" title="안내">📖</button><button type="button" id="instBtn" class="inst" title="설치">📲<span class="tl"> 설치</span></button></span></div>
<div id="iosOv"><div class="io-box"><button type="button" class="io-x" id="iosX">✕</button><h3>🍎 아이폰 · 아이패드는 직접 추가해요</h3><ol class="io-ol"><li><b>사파리</b>로 이 페이지를 열어요 (다른 앱 안이면 사파리로 열기)</li><li>아래쪽(아이패드는 위쪽) <b>공유 버튼 <svg class="ios-share" viewBox="0 0 24 24" aria-label="공유"><path d="M12 3v12M7.5 7.5 12 3l4.5 4.5" fill="none" stroke="#2F7BF6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 10H6.5A1.5 1.5 0 0 0 5 11.5v8A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5v-8A1.5 1.5 0 0 0 17.5 10H16" fill="none" stroke="#2F7BF6" stroke-width="2.2" stroke-linecap="round"/></svg></b>을 눌러요</li><li>목록을 내려서 <b>홈 화면에 추가</b>를 눌러요</li><li>이름이 <b>2-2😻</b>인지 보고 오른쪽 위 <b>추가</b>!</li></ol></div></div>
<div class="frames" id="frames"></div>
<div id="chatPop"><div class="cp-head"><b>💬 우리 반 대화</b><button type="button" id="chatClose">✕</button></div><div class="cp-body" id="chatBody"></div></div>
<script src="snd.js?v=1"></script>
<script>
/* 📱 2-2😻 앱: 한 창 안에서 출석부 · 공지사항 · 아지트 · to. 시내T · 안내를 탭으로 오가요 (한 번 연 화면은 그대로 살아 있어요) */
const q = new URLSearchParams(location.search);
let API = q.get('api') || 'https://script.google.com/macros/s/AKfycbz9ZcvHtg8iI1biBkXBW4DA3A-taLQzSrZq4qFEM17kTNKTpqDeX9UFyq2qLVxu00c/exec';
try { const moved = localStorage.getItem('nyangApi'); if (!q.get('api') && moved && /^https:\/\/script\.google\.com\//.test(moved)) API = moved; } catch(e){}
/* 🔄 늘 최신 화면: 주소 끝에 시각을 붙여서 예전 화면(캐시)이 안 나오게 해요 */
const fresh = u => u + (u.includes('?') ? '&' : '?') + '_=' + Date.now();
const SRC = { notice: 'student.html?only=notice&api=' + encodeURIComponent(API), me: 'student.html?api=' + encodeURIComponent(API), board: 'index.html?view=1&api=' + encodeURIComponent(API), guide: 'guide.html?inapp=1', ask: 'student.html?only=ask&api=' + encodeURIComponent(API) };
const frames = {};
function show(t){
  if (!SRC[t]) t = 'board';
  curTab = t;
  if (!frames[t]){ const f = document.createElement('iframe'); f.src = fresh(SRC[t]); f.title = t; f.onload = () => { try { if (f.classList.contains('on')) f.contentWindow.postMessage({ nyang:'shown' }, location.origin); } catch(e){} }; document.getElementById('frames').appendChild(f); frames[t] = f; }
  Object.entries(frames).forEach(([k, f]) => { f.classList.toggle('on', k === t); if (k !== t) try { f.contentWindow.postMessage({ nyang:'hidden' }, location.origin); } catch(e){} });
  try { frames[t].contentWindow.postMessage({ nyang:'shown' }, location.origin); } catch(e){}   // 아지트: 로그인 안 했으면 로그인 창
  document.querySelectorAll('[data-t]').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  history.replaceState(null, '', '?tab=' + t + (q.get('api') ? '&api=' + encodeURIComponent(q.get('api')) : ''));
}
let curTab = 'board';
/* 🔊 소리: 수업 중 자동 음소거 · 누르면 지금 시간만 반대로 (다음 구간이면 다시 자동) */
function sndShow(){ if (!window.NySnd) return; const s = NySnd.state(), b = document.getElementById('sndBtn'); b.firstChild.textContent = s.muted ? '🔇' : '🔊';
  b.classList.toggle('auto', s.muted && s.inClass && !s.manual); b.classList.toggle('off', s.muted && !(s.inClass && !s.manual)); b.querySelector('.snd-b').hidden = !(s.muted && s.inClass && !s.manual);
  b.title = s.muted ? (s.inClass && !s.manual ? '수업 중이라 소리가 꺼져 있어요 · 누르면 이번 시간만 켜요' : '소리 꺼짐 · 누르면 켜요') : (s.inClass ? '이번 시간만 소리 켜 둠 · 누르면 꺼요' : '소리 켜짐 · 누르면 이번 쉬는 시간 동안 꺼요'); }
document.getElementById('sndBtn').onclick = () => { if (!window.NySnd) return; const s = NySnd.toggle(); sndShow(); };
sndShow(); setInterval(sndShow, 10000); addEventListener('storage', e => { if (e.key === 'nyangClass' || e.key === 'nyangSndOv') sndShow(); });
document.getElementById('reloadBtn').onclick = () => { const f = frames[curTab]; if (f){ f.src = fresh(SRC[curTab]); } const b = document.getElementById('reloadBtn'); b.classList.remove('spin'); void b.offsetWidth; b.classList.add('spin'); };
document.querySelector('.bar').addEventListener('click', e => { const b = e.target.closest('[data-t]'); if (b) show(b.dataset.t); });
addEventListener('message', e => { if (e.origin !== location.origin) return; const d = e.data || {}; if (d.nyang === 'go' && SRC[d.tab]) show(d.tab); });
show(q.get('tab') || 'board');   // 처음엔 늘 출석부 (입장 코드 → 출석부)
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
/* 💬 대화 팝업: 처음부터 숨겨서 열어 두고(안 읽은 수를 받으려고), 칩을 누르면 보여요 */
const chatF = document.createElement('iframe'); chatF.src = fresh('student.html?only=chat&api=' + encodeURIComponent(API)); chatF.title = 'chat'; document.getElementById('chatBody').appendChild(chatF);
function chatToggle(open){
  const pop = document.getElementById('chatPop'); open = open === undefined ? !pop.classList.contains('on') : open;
  pop.classList.toggle('on', open); document.getElementById('chatChip').classList.toggle('on', open);
  try { chatF.contentWindow.postMessage({ nyang:'chatOpen', open }, location.origin); if (open) chatF.contentWindow.postMessage({ nyang:'shown' }, location.origin); } catch(e){}
}
document.getElementById('chatChip').onclick = () => chatToggle();
document.getElementById('chatClose').onclick = () => chatToggle(false);
addEventListener('message', e => { if (e.origin !== location.origin) return; const d = e.data || {}; if (d.nyang !== 'chat') return;
  const dot = document.getElementById('chatDot'); dot.hidden = !d.unread; dot.textContent = d.unread > 9 ? '9+' : d.unread;
  document.getElementById('chatFaces').innerHTML = (d.faces || []).map(u => `<img src="${u}" alt="">`).join(''); });
/* 📲 설치: 크롬 · 엣지 · 안드로이드는 버튼 한 번, 아이폰 · 아이패드는 방법 안내 · 이미 앱이면 버튼 숨김 */
let instEvt = null;
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isApp = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
const ib = document.getElementById('instBtn'); if (isApp) ib.hidden = true;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); instEvt = e; });
addEventListener('appinstalled', () => { ib.hidden = true; toast('🎉 설치 완료! 바탕화면 · 홈 화면의 2-2😻를 눌러요'); });
function toast(t){ let el = document.querySelector('.toast'); if (!el){ el = document.createElement('div'); el.className = 'toast'; document.body.appendChild(el); } el.textContent = t; el.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => el.style.display = 'none', 4000); }
ib.onclick = async () => {
  if (isIOS){ document.getElementById('iosOv').classList.add('on'); return; }
  if (instEvt){ instEvt.prompt(); const r = await instEvt.userChoice; instEvt = null; if (r.outcome !== 'accepted') toast('설치를 취소했어요'); return; }
  toast('이미 설치돼 있거나, 이 브라우저는 메뉴(⋮)에서 직접 설치해요');
};
document.getElementById('iosX').onclick = () => document.getElementById('iosOv').classList.remove('on');
</script>
</body></html>
