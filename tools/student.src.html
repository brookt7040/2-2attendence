<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>냥냥 마을 · 학생용</title>
<style>
@font-face{font-family:'NeoDunggeunmo';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.3/NeoDunggeunmo.woff') format('woff');font-weight:normal;font-style:normal;}
:root{
  --ink:#5B4636; --ink-soft:#8A7060; --y:#FFD84D; --y-deep:#F5B70A; --y-soft:#FFF2BF; --cream:#FFFCF3;
  --pink:#FFC2D4; --pink-deep:#FF7FA6; --mint:#C4F0DD; --sky:#CDE8FF; --lav:#E2D8FF;
}
*{box-sizing:border-box;}
html,body{margin:0;}
body{
  font-family:'NeoDunggeunmo',sans-serif;color:var(--ink);min-height:100vh;padding:14px 14px 40px;
  background-color:#FFF5D1;
  background-image:radial-gradient(rgba(255,207,51,.30) 3px, transparent 3.6px),radial-gradient(rgba(255,170,198,.26) 3px, transparent 3.6px);
  background-size:40px 40px,40px 40px;background-position:0 0,20px 20px;background-attachment:fixed;
}
button,input,select{font-family:inherit;color:var(--ink);}
.pix{image-rendering:pixelated;image-rendering:crisp-edges;}
.wrap{max-width:1100px;margin:0 auto;}

/* 헤더 */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
#mascot{width:72px;height:72px;animation:bob 2.4s ease-in-out infinite;flex:none;}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.title{font-size:1.9rem;color:var(--y);line-height:1.2;
  text-shadow:2px 0 var(--ink),-2px 0 var(--ink),0 2px var(--ink),0 -2px var(--ink),2px 2px var(--ink),-2px -2px var(--ink),2px -2px var(--ink),-2px 2px var(--ink),0 5px var(--ink);}
.sub{font-size:1rem;color:var(--ink-soft);margin-top:4px;}
.me-bar{margin-left:auto;display:flex;align-items:center;gap:8px;}
.btn{border:3px solid var(--ink);border-radius:14px;padding:8px 14px;font-size:1.05rem;cursor:pointer;box-shadow:0 4px 0 var(--ink);background:#fff;}
.btn:active{transform:translateY(4px);box-shadow:none;}
.btn-y{background:var(--y);} .btn-pink{background:var(--pink);} .btn-gray{background:#EEE6DA;} .btn-mint{background:var(--mint);}
.chip{background:#fff;border:3px solid var(--ink);border-radius:999px;padding:6px 14px;font-size:1rem;box-shadow:0 3px 0 var(--ink);}

/* 탭 */
.tabs{display:flex;gap:8px;margin:16px 0 14px;flex-wrap:wrap;}
.tab{flex:1;min-width:110px;border:3px solid var(--ink);border-radius:16px;padding:10px 6px;font-size:1.15rem;cursor:pointer;background:#fff;box-shadow:0 4px 0 var(--ink);position:relative;}
.tab.active{background:var(--y);transform:translateY(-2px);box-shadow:0 6px 0 var(--ink);}
.dot{position:absolute;top:-6px;right:-6px;width:16px;height:16px;border-radius:50%;background:var(--pink-deep);border:2px solid var(--ink);display:none;}
.dot.on{display:block;}
.panel{display:none;} .panel.on{display:block;}

.box{position:relative;background:#FFFDF6;border:3px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);padding:26px 16px 14px;margin:24px 0 14px;}
.box-head{position:absolute;top:-17px;left:16px;background:var(--y);border:3px solid var(--ink);border-radius:999px;padding:3px 16px;font-size:1.15rem;box-shadow:0 3px 0 var(--ink);white-space:nowrap;}
.box-head.pink{background:var(--pink);} .box-head.lav{background:var(--lav);} .box-head.mint{background:var(--mint);}
.empty{color:var(--ink-soft);font-size:1rem;}
.n-item{display:flex;gap:10px;align-items:flex-start;padding:7px 2px;border-bottom:2px dashed #F0E2BC;font-size:1.3rem;line-height:1.45;word-break:keep-all;}
.n-item:last-child{border-bottom:none;}
.n-text{flex:1;}
.ack{flex:none;border:2px solid var(--ink);border-radius:999px;padding:3px 10px;font-size:.95rem;background:#fff;cursor:pointer;box-shadow:0 2px 0 var(--ink);white-space:nowrap;}
.ack.done{background:var(--mint);cursor:default;}
.num{flex:none;width:34px;height:34px;border:3px solid var(--ink);border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:1.1rem;}
.clean-me{background:#FFE0E7;border:3px solid var(--ink);border-radius:14px;padding:10px 14px;font-size:1.2rem;margin-bottom:10px;}
.clean-list{display:flex;flex-wrap:wrap;gap:6px;}
.clean-list span{border:2px solid var(--ink);border-radius:999px;padding:2px 12px;background:var(--lav);}

/* 마을 */
.ticker{background:#fff;border:3px solid var(--ink);border-radius:999px;padding:6px 16px;font-size:1.05rem;margin-bottom:14px;overflow:hidden;white-space:nowrap;box-shadow:0 3px 0 var(--ink);}
.ticker span{display:inline-block;padding-left:100%;animation:tick 18s linear infinite;}
@keyframes tick{to{transform:translateX(-100%)}}
.village{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:18px;}
.vcat{position:relative;background:#fff;border:3px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--ink);padding:12px 6px 10px;text-align:center;cursor:pointer;}
.vcat.mine{background:var(--y-soft);}
.vcat canvas{width:84px;height:84px;}
.vname{font-size:1.2rem;margin-top:2px;}
.vlv{font-size:.85rem;color:var(--ink-soft);}
.new{position:absolute;top:-12px;right:-8px;background:var(--pink-deep);color:#fff;border:2px solid var(--ink);border-radius:999px;font-size:.8rem;padding:1px 8px;animation:bob 1.2s ease-in-out infinite;}
.lv-deco{position:absolute;top:-15px;left:50%;transform:translateX(-50%);font-size:1.3rem;pointer-events:none;}
.lv-frame{position:absolute;inset:-8px;border-radius:27px;pointer-events:none;border:4px solid transparent;}
.lv-2 .lv-frame{border-color:#BDEFD9;}
.lv-3 .lv-frame{border-color:#FFC2D4;}
.lv-4 .lv-frame{border-color:#FFD84D;}
.lv-5 .lv-frame{border:4px dashed #FF9EC4;}
.lv-6 .lv-frame{border-color:#9FD3FF;box-shadow:0 0 12px 2px rgba(140,200,255,.7);}
.lv-7 .lv-frame{border-color:#FFFFFF;box-shadow:0 0 16px 5px rgba(170,215,255,.95);}
.lv-8 .lv-frame{border:6px double #F5B70A;box-shadow:0 0 14px 3px rgba(255,200,40,.6);}
.lv-9 .lv-frame{border-color:#A996FF;box-shadow:0 0 18px 5px rgba(169,150,255,.75);animation:glowPulse 2s ease-in-out infinite;}
.lv-10 .lv-frame{border:6px solid transparent;background:conic-gradient(#FF9AAE,#FFD84D,#7FD8BE,#8CC8FF,#A996FF,#FF9AAE) border-box;
  -webkit-mask:linear-gradient(#000 0 0) padding-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:hueSpin 3s linear infinite;}
@keyframes glowPulse{0%,100%{box-shadow:0 0 10px 2px rgba(169,150,255,.5)}50%{box-shadow:0 0 22px 7px rgba(169,150,255,.95)}}
@keyframes hueSpin{to{filter:hue-rotate(360deg)}}

/* 내 고양이 */
.me-card{display:flex;gap:18px;align-items:center;flex-wrap:wrap;}
.frame{position:relative;width:170px;height:170px;background:#FFFDF6;border:3px solid var(--ink);border-radius:24px;box-shadow:0 6px 0 var(--ink);display:flex;align-items:center;justify-content:center;flex:none;margin:8px;}
.frame canvas{width:140px;height:140px;animation:bob 2.2s ease-in-out infinite;}
.me-info{flex:1;min-width:220px;font-size:1.15rem;line-height:1.7;}
.me-lv{font-size:1.7rem;}
.bar{height:16px;border:3px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden;margin:4px 0;}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#FFD84D,#FF9EC4);}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;}
.ci{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:8px 11px 10px;}
.ci.locked{background:#F3EEE6;color:#A8978A;border-style:dashed;}
.ci-head{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:1.1rem;}
.ci-head small{font-size:.8rem;color:var(--ink-soft);white-space:nowrap;}
.swatches{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;align-items:center;}
.sw{width:36px;height:36px;border-radius:50%;border:3px solid var(--ink);cursor:pointer;box-shadow:0 2px 0 var(--ink);padding:0;}
.sw.on{outline:3px solid var(--pink-deep);outline-offset:2px;transform:scale(1.12);}
.sw-off{border:2px solid var(--ink);border-radius:999px;padding:3px 10px;font-size:.85rem;background:#EEE6DA;cursor:pointer;}
.ci-on{font-size:.85rem;color:#C0506F;margin-top:5px;min-height:1em;}
.ci-lock{margin-top:8px;font-size:.95rem;}

/* 대화 */
.chat{display:flex;flex-direction:column;gap:8px;}
.chat-warn{font-size:.9rem;background:#FFF0B8;border:2px solid var(--ink);border-radius:10px;padding:5px 10px;}
.chat-log{height:320px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:10px;}
.msg{max-width:82%;display:flex;flex-direction:column;gap:2px;}
.msg .who{font-size:.8rem;color:var(--ink-soft);}
.msg .bub{background:#FFF7DA;border:2px solid var(--ink);border-radius:14px 14px 14px 4px;padding:6px 10px;font-size:1.05rem;line-height:1.4;word-break:break-all;}
.msg.me{align-self:flex-end;align-items:flex-end;}
.msg.me .bub{background:#FFE3EE;border-radius:14px 14px 4px 14px;}
.msg.wh .bub{background:var(--lav);border-style:dashed;}
.msg.t .bub{background:#DFF7EC;}
.chat-in{display:flex;gap:6px;}
.chat-in select{width:auto;flex:none;font-size:1rem;padding:8px;}
.chat-in input{flex:1;font-size:1.05rem;padding:8px 10px;}
.chat-off{text-align:center;color:var(--ink-soft);padding:10px;}
/* 건의함 */
textarea{width:100%;padding:10px;font-size:1.1rem;border:3px solid var(--ink);border-radius:12px;background:#fff;font-family:inherit;color:var(--ink);resize:vertical;}
.ask-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0;}
.ask-row select{width:auto;}
.my-ask{border-top:2px dashed #F0E2BC;padding:8px 2px;font-size:1.05rem;line-height:1.45;}
.my-ask .meta{font-size:.85rem;color:var(--ink-soft);}
.my-ask .rep{background:var(--mint);border:2px solid var(--ink);border-radius:10px;padding:5px 10px;margin-top:4px;}
.my-ask .wait{font-size:.9rem;color:var(--ink-soft);margin-top:3px;}

/* 냥코인 */
.coin-big{font-size:2.4rem;text-align:center;margin:4px 0;}
.coin-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px;}
.ms-group{font-size:1.05rem;color:var(--ink-soft);margin:10px 2px 4px;}
.ms{display:flex;align-items:center;gap:8px;padding:7px 4px;border-bottom:2px dashed #F0E2BC;font-size:1.05rem;}
.ms .nm{flex:1;line-height:1.35;}
.ms .cn{white-space:nowrap;color:#C98000;}
.ms button,.shop-item button{border:2px solid var(--ink);border-radius:10px;padding:4px 10px;font-size:.92rem;cursor:pointer;background:var(--y);box-shadow:0 2px 0 var(--ink);white-space:nowrap;font-family:inherit;}
.ms .st{font-size:.85rem;color:var(--ink-soft);white-space:nowrap;}
.shop-tabs{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap;}
.shop-tabs button{flex:1;border:2px solid var(--ink);border-radius:12px;padding:6px;background:#fff;cursor:pointer;font-family:inherit;font-size:1rem;}
.shop-tabs button.on{background:var(--y);}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
.shop-item{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:8px;text-align:center;display:flex;flex-direction:column;gap:5px;align-items:center;}
.shop-item canvas{width:64px;height:64px;image-rendering:pixelated;}
.shop-item .pr{color:#C98000;}
.shop-item.owned{background:#F4FFF9;}
.shop-item button:disabled{opacity:.45;cursor:default;}
.req{display:flex;justify-content:space-between;gap:8px;padding:5px 2px;border-bottom:2px dashed #F0E2BC;font-size:1rem;}
/* 게임 */
#gameOv{z-index:30000;}
.g-info{display:flex;justify-content:space-between;font-size:1rem;flex-wrap:wrap;gap:6px;}
.bets{display:flex;gap:6px;justify-content:center;}
.bets button{border:2px solid var(--ink);border-radius:999px;padding:4px 12px;background:#fff;cursor:pointer;font-family:inherit;font-size:1rem;}
.bets button.on{background:var(--y);}
.g-card{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:10px;text-align:center;}
.g-card h3{margin:0 0 4px;font-weight:normal;font-size:1.2rem;}
.g-btns{display:flex;gap:10px;justify-content:center;margin:8px 0;}
.g-btns button{font-size:2.2rem;width:70px;height:70px;border:3px solid var(--ink);border-radius:18px;background:#FFFDF6;cursor:pointer;box-shadow:0 4px 0 var(--ink);}
.g-btns button:active{transform:translateY(4px);box-shadow:none;}
.g-res{font-size:1.3rem;min-height:1.6em;}
.g-prob{font-size:.85rem;color:var(--ink-soft);}

/* 창 */
.overlay{position:fixed;inset:0;background:rgba(80,60,45,.55);display:none;justify-content:center;align-items:center;z-index:100;padding:12px;}
.modal{position:relative;width:420px;max-width:100%;max-height:92vh;overflow-y:auto;background:var(--cream);border:4px solid var(--ink);border-radius:24px;box-shadow:0 8px 0 var(--ink);padding:20px 20px 18px;display:flex;flex-direction:column;gap:12px;animation:pop .22s ease-out;}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.modal h2{margin:0;text-align:center;font-weight:normal;font-size:1.5rem;}
.x{position:absolute;top:10px;right:10px;width:42px;height:42px;border-radius:12px;border:3px solid var(--ink);background:#FFC9D3;font-size:1.3rem;cursor:pointer;}
select,input[type=password],input[type=text]{width:100%;padding:10px;font-size:1.2rem;border:3px solid var(--ink);border-radius:12px;background:#fff;}
.pin{font-size:2rem!important;text-align:center;letter-spacing:12px;}
.err{color:#D6456E;font-size:1rem;min-height:1.2em;text-align:center;}
.hint{font-size:.9rem;color:var(--ink-soft);}
#toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,160%);background:#fff;border:3px solid var(--ink);border-radius:999px;padding:8px 20px;font-size:1.1rem;box-shadow:0 4px 0 var(--ink);transition:transform .3s;z-index:200;white-space:nowrap;}
#toast.show{transform:translate(-50%,0);}
.status{position:fixed;left:10px;bottom:10px;font-size:.8rem;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:2px 10px;}
@media (max-width:560px){ .title{font-size:1.4rem;} #mascot{width:56px;height:56px;} .n-item{font-size:1.15rem;} }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <canvas id="mascot" class="pix" width="16" height="16"></canvas>
    <div><div class="title" id="title">냥냥 마을</div><div class="sub" id="today"></div></div>
    <div class="me-bar" id="meBar"></div>
  </div>

  <div class="tabs">
    <button type="button" class="tab active" data-tab="notice">📢 알림·종례<span class="dot" id="dotNotice"></span></button>
    <button type="button" class="tab" data-tab="village">🏘️ 냥이 마을<span class="dot" id="dotVillage"></span></button>
    <button type="button" class="tab" data-tab="me">🐱 내 고양이</button>
    <button type="button" class="tab" data-tab="coin">🐾 냥코인</button>
  </div>

  <section class="panel on" id="p-notice">
    <div id="cleanMe"></div>
    <div class="box"><div class="box-head">📢 오늘의 알림</div><div id="noticeList"></div></div>
    <div class="box"><div class="box-head pink">📋 종례</div><div id="closingList"></div></div>
    <div class="box"><div class="box-head lav">🧹 오늘의 청소 당번</div><div id="cleanList"></div></div>
    <div class="box"><div class="box-head mint">📮 질문 · 건의</div><div id="askBox"></div></div>
  </section>

  <section class="panel" id="p-village">
    <div style="text-align:center;margin:6px 0 16px;"><button type="button" class="btn btn-y" id="enterVillage" style="font-size:1.3rem;padding:12px 26px;">🏘️ 마을 입장</button>
      <div class="hint" style="margin-top:6px;">땅을 눌러 걷고, 이모트와 말풍선으로 인사해요. 게임 광장도 있어요!</div></div>
    <div class="ticker" id="ticker" style="display:none;"><span id="tickerText"></span></div>
    <div class="village" id="village"></div>
    <div class="box" style="margin-top:30px;"><div class="box-head pink">💬 우리 반 대화</div><div id="chatBox"></div></div>
  </section>

  <section class="panel" id="p-me">
    <div id="meBox"></div>
  </section>

  <section class="panel" id="p-coin">
    <div id="coinBox"></div>
  </section>
</div>

<div class="overlay" id="loginOv">
  <div class="modal">
    <button type="button" class="x" data-close="loginOv">✕</button>
    <h2>🔑 내 고양이 로그인</h2>
    <select id="loginName"></select>
    <input type="password" class="pin" id="loginPin" inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="off">
    <label class="hint"><input type="checkbox" id="loginKeep"> 이 기기에서 로그인 유지 (내 휴대폰일 때만!)</label>
    <div class="err" id="loginErr"></div>
    <button type="button" class="btn btn-y" id="loginBtn">들어가기</button>
    <div class="hint">비밀번호는 선생님께 받아요. 잊어버렸으면 선생님께 말씀드려요.</div>
  </div>
</div>

<div class="overlay" id="catOv">
  <div class="modal" style="align-items:center;text-align:center;">
    <button type="button" class="x" data-close="catOv">✕</button>
    <div class="frame" id="catFrame"><div class="lv-frame"></div><canvas id="catCanvas" class="pix" width="16" height="16"></canvas></div>
    <h2 id="catName"></h2>
    <div id="catWear" class="hint" style="font-size:1rem;line-height:1.6;"></div>
  </div>
</div>

<div class="overlay" id="gameOv">
  <div class="modal" style="width:460px;">
    <button type="button" class="x" data-close="gameOv">✕</button>
    <h2>🎮 게임 광장</h2>
    <div id="gameBox"></div>
  </div>
</div>

<div id="toast"></div>
<div class="status" id="status">연결 중…</div>

<script>
/* 이 파일은 tools/build_student.py 가 index.html의 고양이 그림 코드를 넣어서 student.html로 만들어요. */
/*@@SHARED_CODE@@*/

/* =========================================================
   🐾 학생용 냥냥 마을
   ========================================================= */
const API = (() => {
  const q = new URLSearchParams(location.search).get('api');
  if (q && /^https:\/\/script\.google(usercontent)?\.com\/|^http:\/\/localhost/.test(q)){ try { localStorage.setItem('nyangApi', q); } catch(e){} return q; }
  try { return localStorage.getItem('nyangApi') || ''; } catch(e){ return ''; }
})();
const CRED_KEY = 'nyangStudent_v1';
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
function todayStr(d = new Date()){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function givenName(name){
  const n = String(name).trim();
  if (/(쌤|샘|선생님|교감|교장)$/.test(n)) return n;
  if (!/^[가-힣]+$/.test(n) || n.length < 3) return n;
  if (n.length >= 4 && ['남궁','황보','제갈','사공','선우','서문','독고','동방'].includes(n.slice(0, 2))) return n.slice(2);
  return n.slice(1);
}
function iga(name){ const c = name.charCodeAt(name.length - 1); return name + ((c >= 0xAC00 && c <= 0xD7A3 && (c - 0xAC00) % 28) ? '이가' : '가'); }

let st = { v:-1, notices:[], closing:[], pub:null };
let me = null;           // { name, pin, info, look, acked }
let busy = false;

/* ---------- 서버 ---------- */
async function api(url, opts){
  const r = await fetch(url, Object.assign({ redirect:'follow' }, opts || {}));
  return r.json();
}
async function pull(force){
  if (!API || busy) return;
  busy = true;
  try {
    const j = await api(`${API}?since=${force ? -1 : st.v}&t=${Date.now()}`);
    if (!j.ok) throw new Error(j.error || 'error');
    const prevNotice = JSON.stringify([st.notices, st.closing]);
    st.notices = j.notices || []; st.closing = j.closing || [];
    if (JSON.stringify([st.notices, st.closing]) !== prevNotice && st.v !== -1 && current !== 'notice') $('dotNotice').classList.add('on');
    if (j.pub){
      const before = st.pub ? JSON.stringify(st.pub.students.map(s => [s.name, s.lookAt])) : '';
      st.pub = j.pub; st.v = j.v;
      if (before && before !== JSON.stringify(st.pub.students.map(s => [s.name, s.lookAt])) && current !== 'village') $('dotVillage').classList.add('on');
      if (me) await refreshMe(true);
    }
    $('status').textContent = '☁️ ' + new Date().toLocaleTimeString('ko-KR', { hour:'2-digit', minute:'2-digit' });
    render();
  } catch(e){ $('status').textContent = '⚠️ 연결 안 됨'; }
  finally { busy = false; }
}
async function studentCall(op, extra){

async function doLogin(){
  const name = $('loginName').value, pin = $('loginPin').value.trim();
  if (!name){ $('loginErr').textContent = '이름을 골라 주세요'; return; }
  if (!/^\d{4}$/.test(pin)){ $('loginErr').textContent = '숫자 4자리를 넣어 주세요'; return; }
  $('loginErr').textContent = '확인 중…';
  try {
    const j = await api(API, { method:'POST', body: JSON.stringify({ action:'student', name, pin, op:'login' }) });
    if (!j.ok){
      $('loginErr').textContent =
        j.error === 'locked' ? `너무 많이 틀렸어요. ${new Date(j.until).toLocaleTimeString('ko-KR', { hour:'2-digit', minute:'2-digit' })} 이후에 다시 해 주세요` :
        j.error === 'nopin'  ? '아직 비밀번호가 없어요. 선생님께 받아 주세요' :
        j.error === 'wrong'  ? (j.until ? '너무 많이 틀려서 10분 동안 잠겼어요' : `비밀번호가 달라요 (남은 기회 ${j.left}번)`) : '잠시 후 다시 해 주세요';
      return;
    }
    me = { name, pin, info: j.me, look: j.look, acked: j.acked || [] };
    const store = $('loginKeep').checked ? localStorage : sessionStorage;
    localStorage.removeItem(CRED_KEY); sessionStorage.removeItem(CRED_KEY);
    store.setItem(CRED_KEY, JSON.stringify({ name, pin }));
    $('loginOv').style.display = 'none';
    toast(`${givenName(name)}, 어서 와! 🐾`);
    chatReset(); coin = null; render(); showTab('me'); chatPull(); askList(); coinCall('coins');
  } catch(e){ $('loginErr').textContent = '연결이 안 돼요. 잠시 후 다시 해 주세요'; }
}

let chat = { msgs: [], last: 0, cfg: null, muted: false, to: '' };
function chatReset(){ chat = { msgs: [], last: 0, cfg: null, muted: false, to: '' }; }
async function chatPull(){
  if (!me || !API) return;

    const j = await studentCall('chatPull', { after: chat.last });

    applyChat(j);
  } catch(e){}

function applyChat(j){
  chat.cfg = j.cfg; chat.muted = j.muted;
  const fresh = (j.msgs || []).filter(m => m.id > chat.last);
  if (fresh.length){
    chat.msgs = chat.msgs.concat(fresh).slice(-200); chat.last = fresh[fresh.length - 1].id;
    if (current !== 'village' && fresh.some(m => m.from !== me.name)) $('dotVillage').classList.add('on');
  }
  renderChat();
}
function renderChat(){
  const box = $('chatBox'); if (!box) return;
  if (!me){ box.innerHTML = '<div class="chat-off">🔑 로그인하면 반 친구들과 대화할 수 있어요</div>'; return; }
  const c = chat.cfg;
  if (!c){ box.innerHTML = '<div class="chat-off">대화 불러오는 중…</div>'; return; }
  if (!c.on){ box.innerHTML = '<div class="chat-off">💤 선생님이 대화를 잠시 꺼 두었어요</div>'; return; }
  const kidsList = (st.pub && st.pub.students || []).map(s => s.name).filter(n => n !== me.name);
  const typing = $('chatText') ? $('chatText').value : '';
  const logHtml = chat.msgs.length ? chat.msgs.map(m => {
      const mine = m.from === me.name, wh = !!m.to, t = /(쌤|샘|선생님)$/.test(m.from);
      const who = mine ? (wh ? `🤫 ${esc(m.to)}에게` : '나') : (wh ? `🤫 ${esc(m.from)} (귓속말)` : esc(m.from));
      return `<div class="msg ${mine ? 'me' : ''} ${wh ? 'wh' : ''} ${t ? 't' : ''}"><span class="who">${who} · ${esc(m.t.slice(11))}</span><span class="bub">${esc(m.text)}</span></div>`;
    }).join('') : '<div class="chat-off">첫 인사를 남겨 보자! 🐾</div>';
  const sig = JSON.stringify([c, chat.muted, kidsList]);
  if (document.activeElement && document.activeElement.id === 'chatText' && box.dataset.sig === sig && $('chatLog')){
    const log = $('chatLog'), atBottom = log.scrollTop + log.clientHeight >= log.scrollHeight - 30;
    log.innerHTML = logHtml; if (atBottom) log.scrollTop = log.scrollHeight;

  box.innerHTML = `<div class="chat">

    <div class="chat-log" id="chatLog">${logHtml}</div>
    ${!c.open ? `<div class="chat-off">🌙 지금은 대화 쉬는 시간이에요 (${esc(c.start)}~${esc(c.end)}에 할 수 있어요)</div>`
      : chat.muted ? '<div class="chat-off">🔇 선생님이 잠시 대화 쓰기를 막아 두었어요</div>'
      : `<div class="chat-in">
          ${c.whisper ? `<select id="chatTo"><option value="">📢 전체</option>${kidsList.map(n => `<option value="${esc(n)}" ${chat.to === n ? 'selected' : ''}>🤫 ${esc(n)}</option>`).join('')}</select>` : ''}
          <input type="text" id="chatText" maxlength="100" placeholder="${chat.to ? '귓속말 보내기' : '메시지 보내기'}" value="${esc(typing)}">
          <button type="button" class="btn btn-y" id="chatSend">보내기</button></div>`}
  </div>`;
  const log = $('chatLog'); if (log) log.scrollTop = log.scrollHeight;

async function coinCall(op, extra){
  if (!me) return null;
  try { const j = await studentCall(op, extra); if (j && j.ok){ coin = j; renderCoin(); render(); } return j; } catch(e){ toast('연결이 안 돼요'); return null; }
}
const ERR = { poor:'코인이 모자라요 🐾', soldout:'다 팔렸어요', owned:'이미 있어요', full:'정원 자리가 꽉 찼어요 (4개)', noitem:'지금은 살 수 없어요', pending:'이미 신청했어요. 선생님이 확인 중이에요', done:'이번에는 이미 받았어요',
  closed:'지금은 게임 시간이 아니에요', limit:'오늘은 게임을 다 했어요. 내일 또 만나요!', bet:'걸 수 있는 코인을 확인해 주세요', bad:'다시 해 주세요' };
function weekStartS(d = new Date()){ const x = new Date(d); const wd = x.getDay() === 0 ? 7 : x.getDay(); x.setDate(x.getDate() - wd + 1); return todayStr(x); }
function periodS(limit){ return limit === 'day' ? todayStr() : limit === 'week' ? weekStartS() : limit === 'once' ? 'all' : null; }
function itemSprite(it){
  const c = document.createElement('canvas'); c.width = 64; c.height = 64; const x = c.getContext('2d'); x.imageSmoothingEnabled = false;
  if (it.cat === 'house') drawHouse(x, it.id, 0, 0); else if (it.cat === 'decor'){ x.save(); x.scale(2, 2); drawDecor(x, it.id, 0, 0); x.restore(); }
  return c;
}
function hoursText(g){ const d = ['', '월', '화', '수', '목', '금']; return [1,2,3,4,5].map(i => (g.hours || {})[i] ? `${d[i]} ${g.hours[i][0]}~${g.hours[i][1]}` : null).filter(Boolean).join(' · ') || '없음'; }
function renderCoin(){
  const box = $('coinBox'); if (!box) return;
  if (!me){ box.innerHTML = '<div class="box" style="text-align:center;"><div class="box-head">🐾 냥코인</div><p>🔑 로그인하면 미션·상점·게임을 이용할 수 있어요</p></div>'; return; }
  if (!coin){ box.innerHTML = '<div class="box"><div class="box-head">🐾 냥코인</div><div class="empty">불러오는 중…</div></div>'; return; }
  const eco = coin.economy, claimed = new Set(coin.claimed || []), pend = new Set((coin.reqs || []).filter(r => r.status === '대기' && r.type === '미션').map(r => r.itemId));
  const groups = [['daily','☀️ 매일 미션'], ['weekly','📅 매주 미션'], ['all','⭐ 특별 미션']];
  const msHtml = groups.map(([k, t]) => {
    const list = eco.missions.filter(m => m.cat === k); if (!list.length) return '';
    return `<div class="ms-group">${t}</div>` + list.map(m => {
      const per = periodS(m.limit), got = per && claimed.has(`m:${m.id}:${me.name}:${per}`);
      const right = got ? '<span class="st">✔ 받았어요</span>' : pend.has(m.id) ? '<span class="st">⏳ 확인 중</span>'
        : m.auto ? '<span class="st">자동 지급</span>' : m.req ? `<button type="button" data-mreq="${m.id}">완료했어요!</button>` : '<span class="st">선생님이 줘요</span>';
      return `<div class="ms"><span class="nm">${esc(m.name)}</span><span class="cn">+${m.coins}🐾</span>${right}</div>`;
    }).join('');
  }).join('');
  const items = eco.shop.filter(x => x.cat === shopTab), inv = coin.inv || {};
  const shopHtml = items.map(it => {
    const owned = it.cat === 'house' && (inv.houses || []).includes(it.id), living = it.cat === 'house' && inv.house === it.id;
    const left = it.stock ? it.stock - ((coin.sold || {})[it.id] || 0) : null;
    const btn = it.cat === 'house' && owned
      ? (living ? '<span class="st">🏠 사는 중</span>' : `<button type="button" data-house="${it.id}">이사하기</button>`)
      : `<button type="button" data-buy="${it.id}" ${coin.balance < it.price || left === 0 ? 'disabled' : ''}>${left === 0 ? '품절' : '사기'}</button>`;
    return `<div class="shop-item ${owned ? 'owned' : ''}">${it.cat !== 'coupon' ? `<span data-spr="${it.id}"></span>` : ''}<div>${esc(it.name)}</div><div class="pr">${it.price} 🐾${left != null ? ` · 남은 ${Math.max(0, left)}개` : ''}</div>${btn}</div>`;
  }).join('') || '<div class="empty">상품이 없어요</div>';
  const g = eco.game;
  box.innerHTML = `
    <div class="box"><div class="box-head">🐾 내 냥코인</div>
      <div class="coin-big">${coin.balance} 🐾</div>
      <div class="coin-actions"><button type="button" class="btn btn-mint" id="coinVillage">🏘️ 마을로</button><button type="button" class="btn btn-y" id="coinGame">🎮 게임 광장</button></div>
      <div class="hint" style="text-align:center;margin-top:6px;">게임 시간: ${hoursText(g)} · 하루 ${g.daily}판</div></div>
    <div class="box"><div class="box-head pink">📋 미션</div>${msHtml}<div class="hint" style="margin-top:6px;">'완료했어요!'를 누르면 선생님이 확인하고 코인을 줘요.</div></div>
    <div class="box"><div class="box-head mint">🛒 상점</div>
      <div class="shop-tabs"><button type="button" data-stab="coupon" class="${shopTab === 'coupon' ? 'on' : ''}">🎟 쿠폰</button><button type="button" data-stab="house" class="${shopTab === 'house' ? 'on' : ''}">🏠 내 집</button><button type="button" data-stab="decor" class="${shopTab === 'decor' ? 'on' : ''}">🌷 정원 (${(inv.decor || []).length}/4)</button></div>
      ${shopTab === 'house' ? `<div class="hint" style="margin-bottom:6px;">처음엔 📦 박스집에 살아요. 집을 사면 마을에 바로 지어져요!${inv.house ? ' <button type="button" data-house="" style="font-size:.85rem;">📦 박스집으로</button>' : ''}</div>` : ''}
      ${shopTab === 'coupon' ? '<div class="hint" style="margin-bottom:6px;">쿠폰을 사면 선생님께 신청돼요. 실물을 받으면 &quot;지급 완료&quot;로 바뀌어요.</div>' : ''}
      <div class="shop-grid">${shopHtml}</div></div>
    <div class="box"><div class="box-head lav">🎟 내 신청</div>${(coin.reqs || []).length ? coin.reqs.map(r => `<div class="req"><span>${r.type === '미션' ? '✅' : '🎟'} ${esc(r.item)}</span><span class="st">${esc(r.status)}</span></div>`).join('') : '<div class="empty">아직 없어요</div>'}</div>
    <div class="box"><div class="box-head">📜 코인 기록</div>${(coin.ledger || []).map(l => `<div class="req"><span>${esc(l.t.slice(5))} · ${esc(l.why)}</span><span style="color:${l.amt >= 0 ? '#1F8A5F' : '#D6456E'}">${l.amt >= 0 ? '+' : ''}${l.amt}</span></div>`).join('') || '<div class="empty">아직 없어요</div>'}</div>`;
  box.querySelectorAll('[data-spr]').forEach(el => { const it = eco.shop.find(x => x.id === el.dataset.spr); el.replaceWith(itemSprite(it)); });
}
/* 🎮 게임 */
function openGame(){
  if (!me){ toast('로그인하면 게임을 할 수 있어요'); return; }
  $('gameOv').style.display = 'flex'; renderGame(); coinCall('coins');
}
function renderGame(res){
  const box = $('gameBox'); if (!box || !coin) { if (box) box.innerHTML = '<div class="empty">불러오는 중…</div>'; return; }
  const g = coin.economy.game, bets = [5, 10, 20, 30, 50].filter(b => b <= g.maxBet);
  if (!bets.includes(betAmt)) betAmt = bets[bets.length - 1] || 1;
  const open = g.on && g.open;
  box.innerHTML = `<div class="g-info"><span>🐾 ${coin.balance}</span><span>오늘 남은 판 ${coin.playsLeft}/${g.daily}</span></div>
    ${!open ? `<div class="chat-off">🌙 지금은 게임 시간이 아니에요<br><small>${hoursText(g)}</small></div>` : `
    <div class="bets">${bets.map(b => `<button type="button" data-bet="${b}" class="${b === betAmt ? 'on' : ''}">${b}</button>`).join('')}</div>
    <div class="g-card"><h3>✊ 하나랑 가위바위보</h3><div class="g-prob">이기면 +${betAmt} · 비기면 그대로 · 지면 -${betAmt}</div>
      <div class="g-btns"><button type="button" data-rps="✊">✊</button><button type="button" data-rps="✌️">✌️</button><button type="button" data-rps="✋">✋</button></div></div>
    <div class="g-card"><h3>🥫 츄르 컵 찾기</h3><div class="g-prob">컵 3개 중 츄르는 하나! 맞히면 +${Math.round(betAmt * 1.5)} · 틀리면 -${betAmt} (맞힐 확률 1/3)</div>
      <div class="g-btns"><button type="button" data-cup="0">🥫</button><button type="button" data-cup="1">🥫</button><button type="button" data-cup="2">🥫</button></div></div>`}
    <div class="g-res" id="gRes">${res || ''}</div>`;
}
async function playGame(g, pick){
  const r = $('gRes'); if (r) r.textContent = '두근두근…';
  const j = await coinCall('game', { g, bet: betAmt, pick });
  if (!j) return;
  if (j.error){ renderGame(ERR[j.error] || '다시 해 주세요'); return; }
  const d = j.result;
  const msg = g === 'rps'
    ? `하나: ${d.hana} → ${d.res === 'win' ? `이겼다! 🎉 +${d.net}` : d.res === 'draw' ? '비겼어요 🤝' : `졌어요 😿 ${d.net}`}`
    : `츄르는 ${['첫', '두', '세'][d.ans]} 번째 컵! ${d.res === 'win' ? `찾았다! 🎉 +${d.net}` : `아쉬워요 😿 ${d.net}`}`;
  renderGame(msg);
}

/* ---------- 이벤트 ---------- */
document.addEventListener('click', e => {
  const t = e.target;
  if (t.closest('.tab')){ showTab(t.closest('.tab').dataset.tab); return; }
  if (t.closest('#loginOpenBtn') || t.closest('#loginOpenBtn2')){ openLogin(); return; }
  if (t.closest('#logoutBtn')){ if (confirm('로그아웃할까요?')) logout(); return; }
  const cl = t.closest('[data-close]'); if (cl){ $(cl.dataset.close).style.display = 'none'; return; }
  const cat = t.closest('[data-cat]'); if (cat){ openCat(st.pub.students[+cat.dataset.cat]); return; }
  const ack = t.closest('[data-ack]');
  if (ack && me && !ack.classList.contains('done')){
    ack.textContent = '…';
    studentCall('ack', { text: ack.dataset.ack }).then(j => { if (j.ok){ me.acked = j.acked || []; toast('확인했어요 ✔'); } render(); }).catch(() => render());
    return;
  }
  const sw = t.closest('[data-it]'); if (sw && me){ const it = ITEM_BY_ID[sw.dataset.it]; changeLook(it.slot, `${it.id}:${sw.dataset.ci}`); return; }
  const off = t.closest('[data-off]'); if (off && me){ changeLook(off.dataset.off, ''); return; }
  if (t.closest('#chatSend')){ chatSend(); return; }
  if (t.closest('#enterVillage') || t.closest('#coinVillage')){ enterVillage(); return; }
  if (t.closest('#coinGame')){ openGame(); return; }
  const st2 = t.closest('[data-stab]'); if (st2){ shopTab = st2.dataset.stab; renderCoin(); return; }
  const mr = t.closest('[data-mreq]'); if (mr){ coinCall('missionReq', { mid: mr.dataset.mreq }).then(j => j && toast(j.error ? (ERR[j.error] || '신청하지 못했어요') : '선생님께 신청했어요 ✅')); return; }
  const by = t.closest('[data-buy]'); if (by){ const it = coin.economy.shop.find(x => x.id === by.dataset.buy); if (!confirm(`${it.name}을(를) ${it.price}🐾에 살까요?`)) return; coinCall('buy', { item: it.id }).then(j => j && toast(j.error ? (ERR[j.error] || '사지 못했어요') : `${it.name} 샀어요! 🎉`)); return; }
  const hs = t.closest('[data-house]'); if (hs){ coinCall('equipHouse', { house: hs.dataset.house }).then(j => j && !j.error && toast('이사 완료! 🏠')); return; }
  const bt = t.closest('[data-bet]'); if (bt){ betAmt = +bt.dataset.bet; renderGame(); return; }
  const rp = t.closest('[data-rps]'); if (rp){ playGame('rps', rp.dataset.rps); return; }
  const cp = t.closest('[data-cup]'); if (cp){ playGame('cups', +cp.dataset.cup); return; }
  if (t.closest('#askSend')){ askSend(); return; }
});
$('loginBtn').addEventListener('click', doLogin);
document.addEventListener('change', e => { if (e.target.id === 'chatTo'){ chat.to = e.target.value; const i = $('chatText'); if (i) i.placeholder = chat.to ? '귓속말 보내기' : '메시지 보내기'; } });
document.addEventListener('keydown', e => { if (e.target.id === 'chatText' && e.key === 'Enter' && !e.isComposing){ e.preventDefault(); chatSend(); } });
$('loginPin').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) pull(); });

/* ---------- 시작 ---------- */
(async function init(){
  drawColors($('mascot'), catColors(MASCOT));
  if (!API){ $('status').textContent = '⚠️ 주소 설정이 필요해요'; $('noticeList').innerHTML = '<div class="empty">선생님이 나눠 준 <b>학생 페이지 링크</b>로 한 번 들어와 주세요.</div>'; return; }
  await pull(true);
  const c = loadCred();
  if (c && c.name && c.pin){
    me = { name: c.name, pin: c.pin, info: null, look: null, acked: [] };
    await refreshMe(true); render(); chatPull(); askList(); coinCall('coins');
  }
  setInterval(() => pull(), 20000);
  setInterval(() => { if (me && !document.hidden) chatPull(); }, current === 'village' ? 6000 : 6000);
  setInterval(() => { if (me && !document.hidden) askList(); }, 60000);
  setInterval(() => { if (me && !document.hidden && current === 'coin') coinCall('coins'); }, 30000);
})();
</script>
